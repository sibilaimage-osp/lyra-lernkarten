<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECO-Volution 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <header class="header">

            <div class="logo">
                ECO-Volution <span>2026</span>
            </div>

            <h1>Deine E-Commerce-Lernkarten</h1>

            <p>
                Wähle ein Kapitel und lerne mit interaktiven Multiple-Choice-Karten.
            </p>

        </header>


        <section class="kapitel">

            <div class="kapitel-header">
                <span class="kapitel-badge">KAPITEL 1</span>

                <h2>E-Commerce & Vertrieb</h2>
            </div>


            <div class="themen">

                <button class="thema" data-thema="E-Business und E-Commerce">
                    1.5 E-Business und E-Commerce
                </button>

                <button class="thema" data-thema="Mobile Commerce">
                    1.5 Mobile Commerce
                </button>

                <button class="thema" data-thema="Marktbeziehungen">
                    1.5 Marktbeziehungen
                </button>

                <button class="thema" data-thema="Vertriebskanäle und Online-Marktplätze">
                    1.5 Vertriebskanäle und Online-Marktplätze
                </button>

                <button class="thema" data-thema="Kanalstrategien">
                    1.6 Kanalstrategien
                </button>

                <button class="thema" data-thema="Singlechannel">
                    1.6 Singlechannel
                </button>

                <button class="thema" data-thema="Multichannel">
                    1.6 Multichannel
                </button>

                <button class="thema" data-thema="Crosschannel">
                    1.6 Crosschannel
                </button>

                <button class="thema" data-thema="Omnichannel">
                    1.6 Omnichannel
                </button>

                <button class="thema" data-thema="Touchpoints und Customer Journey">
                    1.6 Touchpoints und Customer Journey
                </button>

                <button class="thema" data-thema="Click & Collect und Kanalbruch">
                    1.6 Click & Collect und Kanalbruch
                </button>

            </div>

        </section>


        <section class="kapitel">

            <div class="kapitel-header">
                <span class="kapitel-badge">KAPITEL 4</span>

                <h2>Buchführung & Bilanz</h2>
            </div>


            <div class="themen">

                <button class="thema" data-thema="Belege und Belegwesen">
                    4.1 Belege und Belegwesen
                </button>

                <button class="thema" data-thema="Wertströme">
                    4.2 Wertströme: Güterstrom und Geldstrom
                </button>

                <button class="thema" data-thema="Grundsätze ordnungsmäßiger Buchführung">
                    4.3 Grundsätze ordnungsmäßiger Buchführung (GoB)
                </button>

                <button class="thema" data-thema="Inventur und Inventar">
                    4.3 Inventur und Inventar
                </button>

                <button class="thema" data-thema="Vermögen">
                    4.3 Vermögen: Anlagevermögen und Umlaufvermögen
                </button>

                <button class="thema" data-thema="Bewertung und Vorsichtsprinzip">
                    4.3 Bewertung und Vorsichtsprinzip
                </button>

                <button class="thema" data-thema="Inventurvereinfachungsverfahren">
                    4.4 Inventurvereinfachungsverfahren
                </button>

                <button class="thema" data-thema="Bilanz">
                    4.5 Die Bilanz als Grundlage der Buchführung
                </button>

            </div>

        </section>


        <section id="kartenBereich"></section>

    </main>


    <script src="script.js?v=3"></script>

</body>

</html>
